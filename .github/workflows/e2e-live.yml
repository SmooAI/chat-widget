# Nightly credentialed widget e2e (feature gap G5).
#
# Boots a real `smooth-operator-server` (lean, fully in-memory: no database, no
# auth, no AWS) with the demo knowledge base seeded, loads the built widget in
# Chromium, and asserts a STREAMED, KNOWLEDGE-GROUNDED reply renders — the
# seeded fact is a deliberately unusual "17-day return window", so a grounded
# answer must contain "17".
#
# This is separate from ci.yml because it costs money (real LLM calls through
# the SmooAI gateway) and needs a secret. The credential-free half of the suite
# runs on every PR in ci.yml.
name: E2E (live operator, nightly)

on:
    schedule:
        # 07:30 UTC daily.
        - cron: '30 7 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-live
    cancel-in-progress: false

jobs:
    live:
        name: Live widget e2e
        runs-on: ubuntu-latest
        timeout-minutes: 45
        services:
            # Shared storage for the two-instance spec. pgvector because the
            # operator's Postgres adapter creates a `vector` column for knowledge;
            # the stock `postgres` image has no such extension and migration fails.
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: operator_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            # Fail LOUDLY on a missing secret. Without this the specs would
            # `test.skip(...)` and the job would go green having asserted
            # nothing — a suite that reports coverage it does not have.
            - name: Require credentials
              env:
                  SMOOAI_GATEWAY_KEY: ${{ secrets.SMOOAI_GATEWAY_KEY }}
              run: |
                  if [[ -z "$SMOOAI_GATEWAY_KEY" ]]; then
                      echo "::error::SMOOAI_GATEWAY_KEY is not set. The live e2e cannot run, and skipping it silently would report false coverage."
                      exit 1
                  fi
                  echo "gateway key present (${#SMOOAI_GATEWAY_KEY} chars)"

            - name: Checkout chat-widget
              uses: actions/checkout@v4

            - name: Checkout smooth-operator
              uses: actions/checkout@v4
              with:
                  repository: SmooAI/smooth-operator
                  token: ${{ secrets.GH_PAT }}
                  path: .smooth-operator

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .smooth-operator/rust
                  # Distinct cache from the operator repo's own CI jobs.
                  key: chat-widget-e2e

            # `--no-default-features` is the lean local flavour: in-memory
            # storage + backplane, no tokio-postgres / AWS SDK / redis / nats.
            # Retrieval uses the network-free DeterministicEmbedder, which the
            # operator's own `seeded_kb_returns_17_day_fact` unit test covers.
            - name: Build smooth-operator-server (lean)
              working-directory: .smooth-operator/rust
              run: |
                  cargo build -p smooai-smooth-operator-server --bin smooth-operator-server --no-default-features
                  cp target/debug/smooth-operator-server "$RUNNER_TEMP/operator-lean"

            # The multi-instance spec needs the Postgres storage backend, which
            # is a different feature set and so a different binary. Kept separate
            # rather than building everything with `--features postgres`, because
            # that feature also swaps the DeterministicEmbedder for the
            # gateway-backed one — which would change what the seeded-KB spec
            # above is actually testing (and bill for embeddings).
            - name: Build smooth-operator-server (postgres)
              working-directory: .smooth-operator/rust
              run: |
                  cargo build -p smooai-smooth-operator-server --bin smooth-operator-server --no-default-features --features postgres
                  cp target/debug/smooth-operator-server "$RUNNER_TEMP/operator-postgres"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Locate pnpm store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build widget
              run: pnpm build

            - name: Install Playwright chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Live e2e
              env:
                  SMOOTH_AGENT_E2E: '1'
                  SMOOAI_GATEWAY_KEY: ${{ secrets.SMOOAI_GATEWAY_KEY }}
                  # The specs default to a local shared-target path; point them
                  # at this checkout's build instead.
                  SMOOTH_AGENT_SERVER_BIN: ${{ runner.temp }}/operator-lean
              run: pnpm test:e2e:live

            # Two operator instances, one Postgres — the only shape that can
            # catch a regression of the cross-pod session hydration (operator
            # #529). A single-instance spec always finds its own session in its
            # own memory, so it can never see this.
            - name: Multi-instance e2e
              env:
                  SMOOTH_AGENT_E2E: '1'
                  SMOOAI_GATEWAY_KEY: ${{ secrets.SMOOAI_GATEWAY_KEY }}
                  SMOOTH_AGENT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/operator_e2e
                  SMOOTH_AGENT_SERVER_BIN: ${{ runner.temp }}/operator-postgres
              run: pnpm test:e2e:multi-instance

            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results-live
                  path: test-results/
                  retention-days: 14
