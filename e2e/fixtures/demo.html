<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>@smooai/chat-widget — live e2e demo</title>
        <style>
            body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #0b1020;
                color: #e2e8f0;
                min-height: 100vh;
            }
        </style>
    </head>
    <body>
        <h1>chat-widget live e2e</h1>

        <!-- Loads the IIFE bundle produced by `pnpm build`. The element below
             auto-registers. `endpoint` points at the locally-spawned
             smooth-operator-server (see e2e/widget.live.spec.ts), and
             `agent-id` is a fixed UUID because the protocol/pydantic side keys
             the conversation session on a UUID agentId. `start-open` so the
             panel is visible immediately without a launcher click. -->
        <script src="/dist/chat-widget.global.js"></script>
        <script>
            // The element is created here rather than written inline so a spec can
            // point it at a specific server instance with `?endpoint=…`
            // (e2e/multi-instance.live.spec.ts drives TWO). With no query param
            // this is byte-for-byte the old element.
            const el = document.createElement('smooth-agent-chat');
            el.setAttribute('endpoint', new URLSearchParams(location.search).get('endpoint') ?? 'ws://127.0.0.1:8830/ws');
            el.setAttribute('agent-id', '11111111-1111-4111-8111-111111111111');
            el.setAttribute('agent-name', 'Support');
            el.setAttribute('start-open', '');
            document.body.appendChild(el);
        </script>
    </body>
</html>
